rules:
  - id: ai.javascript.eval
    message: "eval() on a non-literal enables code injection. Avoid dynamic code execution on untrusted input."
    languages: [javascript, typescript]
    severity: ERROR
    metadata:
      cwe: "CWE-95"
      category: injection
      blast_radius: rce
      references:
        - references/ai/vibecoder-traps.md
        - references/appsec/language-patterns.md
    patterns:
      - pattern: eval($X)
      - pattern-not: eval("...")
      - pattern-not: eval('...')

  - id: ai.javascript.child-process-shell
    message: "Shelling out with concatenated or interpolated input is a command-injection risk. Prefer execFile/spawn with argv arrays."
    languages: [javascript, typescript]
    severity: ERROR
    metadata:
      cwe: "CWE-78"
      category: injection
      blast_radius: rce
      references:
        - references/ai/vibecoder-traps.md
        - references/appsec/language-patterns.md
        - references/appsec/ssrf-deserialization-command-injection.md
    pattern-either:
      - pattern: exec($A + $B, ...)
      - pattern: execSync($A + $B, ...)
      - pattern: child_process.exec($A + $B, ...)
      - pattern: child_process.execSync($A + $B, ...)
      - pattern: exec(`...${$X}...`, ...)
      - pattern: execSync(`...${$X}...`, ...)
      - pattern: child_process.exec(`...${$X}...`, ...)
      - pattern: child_process.execSync(`...${$X}...`, ...)

  - id: ai.javascript.innerhtml
    message: "Assigning to innerHTML can introduce XSS. Prefer textContent or safe sanitization APIs."
    languages: [javascript, typescript]
    severity: WARNING
    metadata:
      cwe: "CWE-79"
      category: xss
      blast_radius: frontend
      references:
        - references/appsec/browser-security-modern.md
        - references/appsec/frontend-frameworks-security.md
    pattern-either:
      - pattern: $EL.innerHTML = $X
      - pattern: $EL.outerHTML = $X

  - id: ai.javascript.dangerously-set-inner-html
    message: "dangerouslySetInnerHTML bypasses React escaping. Ensure the HTML is sanitized server-side or avoid it."
    languages: [javascript, typescript]
    severity: WARNING
    metadata:
      cwe: "CWE-79"
      category: xss
      blast_radius: frontend
      references:
        - references/appsec/frontend-frameworks-security.md
        - references/appsec/browser-security-modern.md
    pattern: |
      { dangerouslySetInnerHTML: ... }

  - id: ai.javascript.sql-concat
    message: "SQL built via string concatenation is a common AI-generated injection pattern. Use parameterized queries."
    languages: [javascript, typescript]
    severity: ERROR
    metadata:
      cwe: "CWE-89"
      category: injection
      blast_radius: db
      references:
        - references/appsec/language-patterns.md
        - references/appsec/database-security.md
        - references/ai/vibecoder-traps.md
    patterns:
      - pattern-either:
          - pattern: $Q = $STR + $X
          - pattern: $Q = $STR + $X + $Y
          - pattern: $DB.query($STR + $X, ...)
          - pattern: $DB.execute($STR + $X, ...)
          - pattern: $DB.query($STR + $X + $Y, ...)
          - pattern: $DB.execute($STR + $X + $Y, ...)
      - metavariable-regex:
          metavariable: $STR
          regex: (?i).*\b(SELECT|INSERT|UPDATE|DELETE)\b.*

  - id: ai.javascript.sql-template
    message: "SQL built with a template literal interpolates untrusted values. Use parameterized queries / bind parameters."
    languages: [javascript, typescript]
    severity: ERROR
    metadata:
      cwe: "CWE-89"
      category: injection
      blast_radius: db
      references:
        - references/appsec/database-security.md
        - references/appsec/language-patterns.md
        - references/ai/vibecoder-traps.md
    patterns:
      - pattern-either:
          - pattern: $Q = `...${$X}...`
          - pattern: $DB.query(`...${$X}...`, ...)
          - pattern: $DB.execute(`...${$X}...`, ...)
      - pattern-regex: (?i)(SELECT|INSERT|UPDATE|DELETE)
