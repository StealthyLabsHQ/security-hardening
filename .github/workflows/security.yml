name: Security Checks

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  # ---------------------------------------------------------------
  # 1. Secret scanning - blocks hardcoded credentials
  # ---------------------------------------------------------------
  gitleaks:
    name: Secret Scanning (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ---------------------------------------------------------------
  # 2. Static analysis - dangerous code patterns (SAST)
  # ---------------------------------------------------------------
  semgrep:
    name: SAST (Semgrep)
    runs-on: ubuntu-latest
    container:
      image: returntocorp/semgrep
    steps:
      - uses: actions/checkout@v4
      - run: semgrep ci --config=auto
        env:
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}

  # ---------------------------------------------------------------
  # 3. Dependency vulnerability scan
  # ---------------------------------------------------------------
  trivy-deps:
    name: Dependency Scan (Trivy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Trivy on filesystem
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          exit-code: 1
          format: table

  # ---------------------------------------------------------------
  # 4. Container image scan (uncomment when a Dockerfile is present)
  # ---------------------------------------------------------------
  # trivy-image:
  #   name: Container Scan (Trivy)
  #   runs-on: ubuntu-latest
  #   steps:
  #     - uses: actions/checkout@v4
  #     - name: Build image
  #       run: docker build -t app:${{ github.sha }} .
  #     - name: Scan image
  #       uses: aquasecurity/trivy-action@master
  #       with:
  #         image-ref: app:${{ github.sha }}
  #         severity: CRITICAL,HIGH
  #         exit-code: 1

  # ---------------------------------------------------------------
  # 5. SBOM generation (uploaded as artifact)
  # ---------------------------------------------------------------
  sbom:
    name: Generate SBOM (Syft)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: anchore/sbom-action@v0
        with:
          format: spdx-json
          output-file: sbom.spdx.json
      - uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.spdx.json

  # ---------------------------------------------------------------
  # 6. Dependency review - block PRs introducing known-vulnerable deps
  # ---------------------------------------------------------------
  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
