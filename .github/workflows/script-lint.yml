name: Script Lint

# Lints small ops/installer scripts that often skip code review:
#   - Bash / POSIX shell via shellcheck
#   - PowerShell via PSScriptAnalyzer (with security-focused rule set)
#
# These tools catch the majority of patterns documented in
# references/language-patterns.md (Bash and PowerShell sections).

on:
  push:
    branches: [main, master]
    paths:
      - '**/*.sh'
      - '**/*.bash'
      - '**/*.ps1'
      - '**/*.psm1'
      - '**/*.psd1'
      - '.github/workflows/script-lint.yml'
  pull_request:
    branches: [main, master]
    paths:
      - '**/*.sh'
      - '**/*.bash'
      - '**/*.ps1'
      - '**/*.psm1'
      - '**/*.psd1'
      - '.github/workflows/script-lint.yml'
  workflow_dispatch:

permissions: {}

concurrency:
  group: script-lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------
  # Bash / POSIX shell - shellcheck
  # ---------------------------------------------------------------
  shellcheck:
    name: Shell scripts (shellcheck)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Run shellcheck
        uses: ludeeus/action-shellcheck@00cae500b08a931fb5698e11e79bfbd38e612a38 # 2.0.0
        env:
          # Treat warnings as errors. Override per-file with `# shellcheck disable=...`
          # and a justification comment.
          SHELLCHECK_OPTS: --severity=warning --enable=all --shell=bash
        with:
          severity: warning
          check_together: 'yes'
          # Skip vendored / generated trees if they exist.
          ignore_paths: >-
            node_modules
            vendor
            .venv
            dist
            build

  # ---------------------------------------------------------------
  # PowerShell - PSScriptAnalyzer with security-focused rules
  # ---------------------------------------------------------------
  pwsh-analyzer:
    name: PowerShell scripts (PSScriptAnalyzer)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Detect PowerShell files
        id: detect
        shell: bash
        run: |
          set -Eeuo pipefail
          if find . -type f \( -name '*.ps1' -o -name '*.psm1' -o -name '*.psd1' \) \
                  -not -path './.git/*' \
                  -print -quit | grep -q .; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "No PowerShell files found - skipping analyzer."
          fi

      - name: Install PSScriptAnalyzer
        if: steps.detect.outputs.found == 'true'
        shell: pwsh
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module -Name PSScriptAnalyzer -Scope CurrentUser -Force -ErrorAction Stop
          Get-Module -ListAvailable PSScriptAnalyzer | Select-Object Name, Version

      - name: Run PSScriptAnalyzer (security rules)
        if: steps.detect.outputs.found == 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $rules = @(
            'PSAvoidUsingInvokeExpression',
            'PSAvoidUsingPlainTextForPassword',
            'PSAvoidUsingConvertToSecureStringWithPlainText',
            'PSAvoidUsingUsernameAndPasswordParams',
            'PSUsePSCredentialType',
            'PSAvoidUsingComputerNameHardcoded',
            'PSAvoidGlobalVars',
            'PSAvoidUsingCmdletAliases',
            'PSUseDeclaredVarsMoreThanAssignments'
          )
          $results = Invoke-ScriptAnalyzer `
                       -Path . `
                       -Recurse `
                       -IncludeRule $rules `
                       -Severity Error,Warning `
                       -ExcludeRule PSUseShouldProcessForStateChangingFunctions `
                       -ReportSummary
          if ($results) {
            $results | Format-Table -AutoSize
            Write-Error "PSScriptAnalyzer found $($results.Count) issue(s). See language-patterns.md (PowerShell section) for fixes."
            exit 1
          }
          Write-Host "PSScriptAnalyzer: no issues found."
