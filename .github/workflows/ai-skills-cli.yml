name: AI Skills CLI

on:
  push:
    branches: [main, master]
    paths:
      - 'tools/ai-skills/**'
      - '.github/workflows/ai-skills-cli.yml'
  pull_request:
    branches: [main, master]
    paths:
      - 'tools/ai-skills/**'
      - '.github/workflows/ai-skills-cli.yml'
  workflow_dispatch:

permissions: {}

concurrency:
  group: ai-skills-cli-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Node CLI tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: tools/ai-skills
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: actions/setup-node@423393ab6bdfa90553cea2582e84cccfed41797c # v4.4.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: tools/ai-skills/package.json

      - name: Run CLI test suite
        run: npm run test:ci
