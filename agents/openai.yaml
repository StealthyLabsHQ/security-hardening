display_name: Security Hardening
short_description: Defensive application security and AI-agent security skill for audits, secure design, code review, scan-and-fix remediation, and hardening.
default_prompt: >
  Review this for security issues. Prefer the operational loop: scope the
  change, run python scripts/secure-review.py, load only the mapped
  references plus core invariants, prioritize exploitable findings and
  trust-boundary gaps, apply the smallest defensive fixes, re-scan, then
  report. Never produce exploit PoCs.
