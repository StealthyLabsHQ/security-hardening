version: 1
profile: gdpr-sensitive

default:
  agent_mode: review_only
  network: deny
  filesystem: workspace_only
  mcp: deny
  git:
    allow_commit: true
    allow_push: false
  data_mode: synthetic_or_pseudonymized_only

allowlists:
  domains:
    - api.github.com
    - docs.internal.example
  mcp_servers:
    - docs

approvals:
  require_for:
    - any_edit
    - install_dependencies
    - any_external_network
    - new_mcp_server
    - git_push
    - release
    - deploy
    - database_migration
    - processor_change
    - retention_change
    - deletion_flow_change
    - dsar_export_change
    - analytics_change
  ttl_minutes: 10
  dual_control_for:
    - processor_change
    - retention_change
    - deletion_flow_change
    - dsar_export_change
    - release
    - deploy

protected_paths:
  deny_read:
    - ".env"
    - ".env.*"
    - "**/.env"
    - "**/.env.*"
    - "secrets/**"
    - "**/*.pem"
    - "**/*.key"
    - "**/*dump*"
    - "exports/**"
    - "backups/**"
    - "support-dumps/**"
    - "**/*customer*export*"
    - "**/*hr*"
    - "**/*payroll*"
    - "**/*legal*"
  high_review:
    - "analytics/**"
    - "privacy/**"
    - "retention/**"
    - "deletion/**"
    - "exports/**"
    - "support/**"

manual_review:
  required_paths:
    - auth
    - rbac
    - webhooks
    - analytics
    - error_reporting
    - support_tooling
    - retention
    - deletion
    - dsar_export
    - processor_change
