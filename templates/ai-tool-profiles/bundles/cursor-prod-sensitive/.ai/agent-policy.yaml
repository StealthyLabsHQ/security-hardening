version: 1
profile: prod-sensitive

default:
  agent_mode: review_only
  network: deny
  filesystem: workspace_only
  mcp: deny
  git:
    allow_commit: true
    allow_push: false

allowlists:
  domains:
    - api.github.com
    - artifacts.internal.example
  mcp_servers:
    - docs

approvals:
  require_for:
    - any_edit
    - install_dependencies
    - new_mcp_server
    - any_external_network
    - git_push
    - release
    - deploy
    - database_migration
    - secret_rotation
    - permission_change
    - workflow_change
    - destructive_filesystem_action
  ttl_minutes: 10
  dual_control_for:
    - release
    - deploy
    - database_migration
    - permission_change
    - secret_rotation

protected_paths:
  deny_read:
    - ".env"
    - ".env.*"
    - "**/.env"
    - "**/.env.*"
    - "secrets/**"
    - "**/*.pem"
    - "**/*.key"
    - "**/*dump*"
    - "exports/**"
    - "backups/**"
    - "support-dumps/**"
  high_review:
    - ".github/workflows/**"
    - "infra/**"
    - "auth/**"
    - "billing/**"
    - "migrations/**"

manual_review:
  required_paths:
    - auth
    - billing
    - webhooks
    - uploads
    - infra
    - ci_cd
    - cloud_iam
    - monitoring
    - retention
    - deletion
