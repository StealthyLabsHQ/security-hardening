# Lychee link checker configuration
# Used by .github/workflows/lint.yml
#
# Goal: catch broken external links in our reference markdown without
# false-positiving on the example/placeholder URLs that necessarily appear
# in security documentation (attacker.*, example.com, fake AWS metadata,
# private network addresses, XML namespace identifiers, etc.).

# Performance / caching
cache = true
max_cache_age = "7d"
max_concurrency = 14
max_redirects = 5
timeout = 20
retry_wait_time = 2

# Accept additional status codes:
#  - 200/206: OK / partial
#  - 401/403: many real docs require auth (chatgpt.com/gpts/editor, etc.)
#  - 429: rate limited - the URL is fine, the runner is just being throttled
#  - 999: LinkedIn's "go away" code for bots
accept = ["200", "206", "401", "403", "429", "999"]

# Skip RFC1918, loopback, link-local and metadata IPs. These appear all
# over the security examples (169.254.169.254, 10.0.0.1, 127.0.0.1, etc.)
# and lychee cannot reach them from a CI runner anyway.
exclude_all_private = true

# Do not check email addresses (we use --exclude-mail equivalent).
include_mail = false

# Do not follow links inside file paths matching these regexes.
exclude_path = [
  "\\.git/",
  "node_modules/",
]

# URLs to exclude from checking. These are intentional placeholders or
# illustrative examples in security documentation - validating them would
# either fail (DNS, auth, private network) or be meaningless.
exclude = [
  # Placeholder / illustrative hostnames
  '^https?://(www\.)?example\.(com|org|net)',
  '^https?://[^/]*\.example(/|$)',
  '^https?://attacker(/|\.|$)',
  '^https?://(get|api|app|cdn|auth|admin|staging)\.[^/]*example\.com',
  '^https?://[^/]*\.mycompany(\.|$)',
  '^https?://[^/]*\.yourdomain\.com',
  '^https?://[^/]*\.yourapp\.com',
  '^https?://[^/]*\.myapp\.com',
  '^https?://npm\.mycompany\.internal',
  '^https?://pypi\.mycompany\.internal',
  '^https?://mycompany\.jfrog\.io',
  '^https?://my-vault\.vault\.azure\.net',
  '^https?://internal-db\.corp',

  # XML and W3C namespace identifiers (look like URLs but are just IDs)
  '^http://apache\.org/xml/',
  '^http://xml\.org/sax/',
  '^http://www\.w3\.org/',

  # The repo's own URLs - the test environment may not be able to reach
  # github.com/StealthyLabsHQ/security-hardening (private / fork / 404).
  '^https?://github\.com/StealthyLabsHQ/security-hardening',
  '^https?://raw\.githubusercontent\.com/StealthyLabsHQ/security-hardening',

  # Anchor-only inline placeholders that appear in code blocks
  '^https?://0\.0\.0\.0',

  # GitHub API endpoints used in code samples (return 401 without a token,
  # already covered by `accept`, but exclude to avoid noise in reports)
  '^https://api\.github\.com/user$',

  # Government and third-party docs that are structurally unstable or
  # require authentication from CI runners.
  '^https://www\.cisa\.gov/ics-advisories',
  '^https://raw\.githubusercontent\.com/google-gemini/gemini-cli/',
]
